name: Build Korg Drum Kit Editor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name KorgDrumKitEditor app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KorgDrumKitEditor-Windows
          path: dist/KorgDrumKitEditor.exe
